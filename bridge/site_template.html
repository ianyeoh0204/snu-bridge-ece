<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNU Bridge</title>
<style>
/* Swiss signage: one typeface, black and white plus SNU blue, a visible grid, no rounding, everything left-aligned. */
/* Yellow is used for cautions only, as on road and station signs. */
:root { --bg:#fff; --ink:#000; --muted:#666; --hair:#c9c9c9; --tint:#f1f1f1; --blue:#002c84; --caution:#ffd60a; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --ink:#fff; --muted:#a3a3a3; --hair:#4a4a4a; --tint:#1c1c1c; --blue:#7ea2ff; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { scroll-padding-top:72px; }
body { margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; overflow-x:clip;
  font:17px/1.45 "Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
:is(a, button, summary, input):focus-visible { outline:3px solid var(--blue); outline-offset:2px; }

.nav { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:2px solid var(--ink); }
.nav div { max-width:980px; height:58px; margin:0 auto; padding:0 22px; display:flex; align-items:center; justify-content:space-between; }
.nav .brand { font-size:17px; font-weight:700; color:var(--blue); text-decoration:none; }
.nav nav { display:flex; gap:24px; align-self:stretch; }
.nav nav a { display:flex; align-items:center; font-size:15px; color:var(--muted); text-decoration:none; border-bottom:4px solid transparent; margin-bottom:-2px; }
.nav nav a[aria-current="page"] { color:var(--ink); font-weight:700; border-bottom-color:var(--blue); }
main { max-width:980px; margin:0 auto; padding:0 22px 96px; }
footer { max-width:936px; margin:0 auto; padding:20px 0 48px; border-top:2px solid var(--ink); font-size:13px; color:var(--muted); }

/* page headers */
.hero { padding:56px 0 8px; }
.eyebrow { margin:0 0 16px; font-size:16px; font-weight:500; }
h1 { margin:0; font-size:clamp(40px, 6.6vw, 64px); font-weight:700; line-height:1; letter-spacing:-.03em; text-wrap:balance; }
.lede { margin:20px 0 32px; max-width:58ch; font-size:19px; line-height:1.4; color:var(--muted); text-wrap:pretty; }
.band { margin:0 calc(50% - 50vw); padding:72px calc(50vw - 50%) 64px; background:var(--blue); color:var(--bg); }
.band p { margin:0; font-size:16px; font-weight:500; }
.band h1 { margin:24px 0 32px; font-size:clamp(56px, 12vw, 120px); line-height:.92; letter-spacing:-.045em; }
.band p:last-child { max-width:56ch; font-size:20px; font-weight:400; line-height:1.4; }

/* controls */
.seg { display:inline-flex; flex-wrap:wrap; border:2px solid var(--ink); }
.deptbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; max-width:var(--wide, 1180px); margin:0 auto; padding:10px 24px; border-bottom:1px solid var(--hair); font-size:13px; }
.deptbar .seg button { min-height:32px; padding:4px 12px; font-size:13px; }
.deptbar .tag { white-space:normal; max-width:100%; }
.seg button { min-height:40px; padding:8px 18px; border:0; background:none; color:var(--ink); font:inherit; font-size:15px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--bg); font-weight:700; }
.pick { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; margin-top:16px; font-size:14px; color:var(--muted); }
.pick .note { flex-basis:100%; margin:0; }
.note { margin:12px 0 0; font-size:13px; color:var(--muted); }
.note a, .source a, .related a, .links a, .more, .notice .body p a { color:var(--blue); font-weight:700; text-decoration:none; }
.trapline a { color:inherit !important; text-decoration:underline !important; }
.source a::after, .related a::after, .links a::after, .more::after, .go::after, .tile a::after { content:" \2192"; }

/* a black bar carries every section heading */
.barhead, .group h2 { display:flex; justify-content:space-between; align-items:center; gap:16px; min-height:48px; margin:0; padding:8px 16px;
  background:var(--ink); color:var(--bg); font-size:16px; font-weight:700; letter-spacing:0; }
.barhead h2 { margin:0; font-size:16px; }
.group h2 span { font-size:14px; font-weight:400; text-align:right; }
.group h2 .plainspan { font-size:inherit; font-weight:inherit; text-align:left; }
.barhead .seg { border:1px solid var(--bg); }
.barhead .seg button { min-height:30px; padding:3px 14px; font-size:14px; color:var(--bg); }
.barhead .seg button[aria-pressed="true"] { background:var(--bg); color:var(--ink); }
.block, .group { margin-top:56px; }
.list { border-bottom:2px solid var(--ink); }

/* home: programs as four columns, notices as a departure board */
.gates { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); border-left:1px solid var(--ink); }
.gate { display:flex; flex-direction:column; min-height:280px; padding:20px 16px; border-right:1px solid var(--ink); border-bottom:2px solid var(--ink); text-decoration:none; color:inherit; }
.gate b { font-size:clamp(60px, 9.4vw, 96px); font-weight:700; line-height:.9; letter-spacing:-.045em; color:var(--blue); }
.gate small { margin-top:8px; font-size:13px; color:var(--muted); }
.gate h3 { margin:44px 0 0; font-size:24px; line-height:1.08; letter-spacing:-.015em; }
.gate p { flex:1; margin:8px 0 0; font-size:14px; color:var(--muted); }
.gate .go { margin-top:16px; font-size:14px; font-weight:700; }
.gate:hover, .gate:focus-visible, .flap:hover, .flap:focus-visible { background:var(--blue); color:var(--bg); outline:0; }
.gate:hover :is(b, small, p), .gate:focus-visible :is(b, small, p) { color:inherit; }
.flaps { background:var(--ink); color:var(--bg); }
.flap { display:grid; grid-template-columns:84px minmax(0, 1fr) auto; gap:16px; align-items:baseline; padding:18px 16px; border-top:1px solid rgba(128,128,128,.5); text-decoration:none; color:inherit; }
.flap time { font-size:14px; letter-spacing:.04em; text-transform:uppercase; font-variant-numeric:tabular-nums; opacity:.72; }
.swap { display:grid; }
.swap span { grid-area:1 / 1; font-size:20px; font-weight:500; line-height:1.25; text-wrap:pretty;
  transition:transform .28s cubic-bezier(.4,0,.2,1); transition-delay:calc(var(--i) * 110ms); }
/* the titles turn like a departure board: the old line folds away, then the new one folds in */
.board[data-lang="en"] .ko, .board[data-lang="ko"] .en { transform:rotateX(90deg); }
.board[data-lang="en"] .en, .board[data-lang="ko"] .ko { transition-delay:calc(var(--i) * 110ms + .28s); }
.more { display:inline-block; margin-top:8px; }

/* requirements: this month, progress, cards */
.tiles { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); margin-top:40px; border-top:2px solid var(--ink); border-left:1px solid var(--ink); }
.tile { padding:16px; border-right:1px solid var(--ink); border-bottom:2px solid var(--ink); }
.tile small { display:block; font-size:13px; color:var(--muted); }
.tile h3 { margin:4px 0 16px; font-size:40px; line-height:1; letter-spacing:-.03em; color:var(--blue); }
.tile a, .tile span { display:block; padding:3px 0; font-size:15px; }
.tile a { color:inherit; font-weight:500; text-decoration:none; }
.tile a:hover { color:var(--blue); }
.tile span { color:var(--muted); }
.progress { margin-top:48px; }
.progress .num { font-size:17px; color:var(--muted); }
.progress .num b { margin-right:6px; font-size:64px; font-weight:700; line-height:1; letter-spacing:-.04em; color:var(--ink); }
.bar { height:8px; margin-top:12px; background:var(--hair); }
.bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
details + details { border-top:1px solid var(--hair); }
summary { list-style:none; display:flex; align-items:center; gap:16px; min-height:60px; padding:14px 16px; cursor:pointer; }
summary::-webkit-details-marker { display:none; }
summary::after { content:"+"; flex:none; width:20px; text-align:center; font-size:24px; line-height:1; }
details[open] > summary::after { content:"\2212"; }
summary:hover :is(.title, .en) { color:var(--blue); }
summary input { appearance:none; -webkit-appearance:none; flex:none; width:24px; height:24px; margin:0; border:2px solid var(--ink); border-radius:0; background:var(--bg); cursor:pointer; display:grid; place-items:center; }
summary input:checked { background:var(--blue); border-color:var(--blue); }
summary input:checked::after { content:""; width:6px; height:11px; margin-top:-2px; border:solid var(--bg); border-width:0 2px 2px 0; transform:rotate(45deg); }
summary .repeat { flex:none; width:24px; text-align:center; font-size:18px; color:var(--muted); }
summary .title { flex:1; font-size:18px; font-weight:700; letter-spacing:-.01em; }
summary .title small { display:block; font-size:14px; font-weight:400; letter-spacing:0; color:var(--muted); }
details.done .title { color:var(--muted); }
.tag { padding:3px 8px; border:1px solid var(--ink); font-size:12px; white-space:nowrap; }
.tag.trap { background:var(--caution); border-color:var(--caution); color:#000; font-weight:700; }
.body { max-width:78ch; padding:0 16px 24px 56px; font-size:16px; line-height:1.5; }
.body ul { margin:0 0 12px; padding-left:18px; }
.body li { margin-bottom:2px; }
.body p { margin:0 0 6px; }
.body b { font-weight:700; }
.later { margin:4px 0 14px; padding:12px 14px; border:2px solid var(--blue); }
.later > b { display:block; margin-bottom:6px; color:var(--blue); }
.later ul { margin:0; padding-left:18px; }
.later li { margin-bottom:8px; }
.later li small { display:block; margin-top:2px; font-size:13px; color:var(--muted); }
.later li a { display:block; margin-top:2px; font-size:13px; color:var(--blue); font-weight:700; text-decoration:none; }
.later li a::after { content:" \2192"; }
.trapline { margin-top:12px !important; padding:10px 12px; background:var(--caution); color:#000; }
.source { margin-top:16px; padding-top:14px; border-top:1px solid var(--hair); font-size:13px; color:var(--muted); }
.source .reason { display:block; margin-top:4px; }
.source blockquote { margin:8px 0; padding:10px 12px; background:var(--tint); color:var(--ink); font-size:14px; }
.related { margin-top:12px; }
.related a { display:block; padding:2px 0; }

/* notices */
.notice summary { align-items:flex-start; }
.notice .head { flex:1; }
.notice .meta { display:flex; align-items:center; gap:10px; margin-bottom:4px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.notice .en { font-size:18px; font-weight:700; letter-spacing:-.01em; }
.notice .body { padding-left:16px; }
.notice .ko { margin:0 0 12px; font-size:14px; color:var(--muted); }
.notice table { width:100%; margin:4px 0 12px; border-collapse:collapse; }
.notice td { padding:7px 0; border-top:1px solid var(--hair); vertical-align:top; }
.notice td:first-child { padding-right:14px; }
.notice td small { display:block; font-size:13px; color:var(--muted); }
.notice ol { margin:4px 0 12px; padding-left:20px; }
.conds { margin:4px 0 12px; } .conds ul { margin:6px 0 0; padding-left:18px; } .conds li { margin-bottom:3px; }
.notice h4 { margin:14px 0 4px; font-size:16px; font-weight:700; }
.notice .full summary { min-height:0; padding:8px 0; font-size:14px; font-weight:700; color:var(--blue); }
.notice .full summary::after { font-size:18px; }
.notice .full p { margin:0 0 10px; white-space:pre-wrap; }
.links { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-size:14px; }


/* why and how: counted evidence, then the method */
.figs { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); border-left:1px solid var(--ink); }
.figs.four { grid-template-columns:repeat(4, minmax(0, 1fr)); }
.fig { padding:20px 16px; border-right:1px solid var(--ink); border-bottom:2px solid var(--ink); }
.fig b { display:block; font-size:clamp(52px, 8.4vw, 88px); font-weight:700; line-height:.9; letter-spacing:-.045em; color:var(--blue); }
.fig b small { margin-left:6px; font-size:.3em; font-weight:500; letter-spacing:0; color:var(--muted); }
.fig h3 { margin:16px 0 0; font-size:18px; line-height:1.2; letter-spacing:-.01em; }
.fig p { margin:8px 0 0; font-size:15px; }
.fig p.dim, .dim { color:var(--muted); }
.years { border-bottom:2px solid var(--ink); }
.year { display:grid; grid-template-columns:84px minmax(0, 1fr); gap:0 16px; padding:16px; border-top:1px solid var(--hair); }
.year:first-child { border-top:0; }
.year > b { font-size:28px; line-height:1; letter-spacing:-.03em; }
.year > b small { display:block; margin-top:6px; font-size:12px; font-weight:400; letter-spacing:0; color:var(--muted); }
.line { display:grid; grid-template-columns:64px minmax(0, 1fr) 200px; gap:12px; align-items:center; padding:3px 0; font-size:14px; font-variant-numeric:tabular-nums; }
.line i { display:block; height:14px; min-width:2px; background:var(--ink); }
.line.en i { background:var(--blue); }
.line span:last-child { text-align:right; }
.ranks { border-bottom:2px solid var(--ink); }
.rank { display:grid; grid-template-columns:76px minmax(0, 1fr) auto; gap:4px 16px; align-items:baseline; padding:14px 16px; border-top:1px solid var(--hair); text-decoration:none; color:inherit; }
.rank:first-child { border-top:0; }
.rank > b { font-size:22px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.rank > b small { display:block; font-size:12px; font-weight:400; letter-spacing:0; color:var(--muted); }
.rank .t { font-weight:700; }
.rank .t small { display:block; margin-top:2px; font-size:14px; font-weight:400; color:var(--muted); }
.rank:hover .t { color:var(--blue); }
.rank em { font-style:normal; font-weight:700; font-size:14px; white-space:nowrap; }
.diff { padding:16px; border-top:1px solid var(--hair); }
.diff:first-child { border-top:0; }
.diffs { border-bottom:2px solid var(--ink); }
.diff h3 { margin:0 0 12px; font-size:18px; letter-spacing:-.01em; }
.diff div { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }
.diff a, .diff span { display:block; padding:12px; background:var(--tint); text-decoration:none; color:inherit; font-size:17px; font-weight:700; }
.diff small { display:block; margin-bottom:6px; font-size:12px; font-weight:400; color:var(--muted); }
.diff a:hover { outline:2px solid var(--blue); }
.plain { margin:0; padding:0; list-style:none; border-bottom:2px solid var(--ink); }
.plain li { padding:12px 16px; border-top:1px solid var(--hair); font-size:16px; }
.plain li:first-child { border-top:0; }
.plain a, .aboutnote a { color:var(--blue); font-weight:700; text-decoration:none; }
.plain b { font-weight:700; }
.aboutnote { margin:12px 0 0; max-width:86ch; font-size:13px; color:var(--muted); }

#footer .extra { display:block; margin-top:10px; color:var(--blue); font-weight:700; text-decoration:none; }
.band .of { margin-left:10px; opacity:.78; font-variant-numeric:tabular-nums; }
.band.small p:first-child .ko2 { display:inline; margin-left:8px; }
.band.small h1 { margin:12px 0 16px; font-size:clamp(34px, 6vw, 60px); line-height:1; letter-spacing:-.03em; }
.nav nav .menu { position:relative; display:flex; }
.nav nav .drop { display:none; position:absolute; top:100%; right:0; z-index:6; width:max-content; min-width:230px; max-width:min(320px, 86vw); background:var(--bg); border:2px solid var(--ink); }
.nav nav .menu:hover .drop, .nav nav .menu:focus-within .drop, .nav nav .menu.open .drop { display:block; }
.nav nav .drop:empty { display:none !important; }
.nav nav .drop a { display:grid; grid-template-columns:20px minmax(0, 1fr); align-items:baseline; gap:0 6px; margin:0; padding:10px 14px; border:0; border-top:1px solid var(--hair); color:var(--ink); font-size:15px; font-weight:400; line-height:1.25; }
.nav nav .drop a:first-child { border-top:0; }
.nav nav .drop a b { font-size:12px; font-weight:400; color:var(--muted); }
.nav nav .drop a:hover, .nav nav .drop a:focus-visible, .nav nav .drop a[aria-current="step"] { background:var(--ink); color:var(--bg); }
.nav nav .drop a:hover b, .nav nav .drop a:focus-visible b, .nav nav .drop a[aria-current="step"] b { color:inherit; opacity:.78; }
.nextstep { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:40px; padding:20px 16px; background:var(--blue); color:#fff; text-decoration:none; font-size:clamp(20px, 3vw, 28px); font-weight:700; line-height:1.15; }
.nextstep small { font-size:14px; font-weight:400; }
.survey { border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); margin-top:16px; }
.survey .row { display:grid; grid-template-columns:minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2.4fr); gap:0 16px; padding:10px 16px; border-top:1px solid var(--hair); align-items:baseline; font-size:16px; }
.survey .row:first-child { border-top:0; }
.survey .head { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.survey .n { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
.survey .own { background:var(--ink); color:var(--bg); }
.survey .lab { display:none; }
.askline { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.ask { padding:8px 14px; border:2px solid var(--ink); background:none; color:var(--ink); font:inherit; font-size:14px; text-align:left; cursor:pointer; }
.ask:hover, .ask:focus-visible { background:var(--ink); color:var(--bg); }
.ask:hover .ko2, .ask:focus-visible .ko2 { color:inherit; opacity:.78; }
.asked { font-size:13px; }
.plain.titles li { padding:8px 0; font-size:15px; }
.plain.titles .links { display:block; margin-top:2px; font-size:12px; color:var(--muted); }
.grids .where { margin:0 0 6px; font-size:13px; letter-spacing:.02em; }
.grids .where a { color:inherit; }
.survey .own a { color:inherit; }
@media (max-width:700px) {
  .survey .row { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:6px 16px; }
  .survey .row > :first-child, .survey .row > :nth-child(4) { grid-column:1 / -1; }
  .survey .row > :first-child { font-weight:700; }
  .survey .head { display:none; }
  .survey .n { text-align:left; }
  .survey .lab { display:block; font-size:11px; font-weight:400; letter-spacing:.04em; text-transform:uppercase; opacity:.7; }
}
#boards { margin-bottom:12px; }
#pilot-note { margin:0 0 16px !important; }
.figs.one { grid-template-columns:minmax(0, 1fr); }
.figs.one .fig { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
.figs.one .fig p { margin:0; font-size:17px; }
.grids { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:28px; padding:20px 16px; border:1px solid var(--ink); border-top:0; border-bottom:2px solid var(--ink); align-items:start; }
.grids h3, .brd h3 { margin:0 0 12px; font-size:15px; font-weight:500; }
.grids h3 b, .brd h3 b { display:block; font-size:clamp(52px, 8.4vw, 88px); font-weight:700; line-height:.9; letter-spacing:-.045em; margin-bottom:8px; }
.grids > div:last-child h3 b { color:var(--blue); }
.sq { display:flex; flex-wrap:wrap; gap:3px; }
.sq i { width:11px; height:11px; background:var(--ink); }
.sq.en i { background:var(--blue); }
.boards { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:12px; align-items:start; }
.brd { background:var(--ink); color:var(--bg); }
.brd.en { background:var(--blue); }
.brd h3 { margin:0; padding:16px; }
.brd > div { display:grid; grid-template-columns:52px minmax(0, 1fr); gap:10px; padding:10px 16px; border-top:1px solid rgba(128,128,128,.5); font-size:14px; line-height:1.3; }
.brd time { opacity:.72; font-variant-numeric:tabular-nums; }
.brd a { color:inherit; text-decoration:none; font-weight:500; }
.brd a:hover { text-decoration:underline; }
.brd a small { display:block; margin-top:2px; font-size:12px; font-weight:400; opacity:.72; }
.brd .all { display:block; padding:14px 16px; border-top:1px solid rgba(128,128,128,.5); font-size:14px; font-weight:700; }

/* two languages on one page: the Korean sits under the English, smaller and lighter */
.ko2 { display:block; margin-top:3px; font-size:max(12px, .68em); font-weight:400; line-height:1.4; letter-spacing:0; color:var(--muted); text-transform:none; }
:is(.band, .barhead, .group h2, .brd, .flaps, .gate:hover, .tag.trap, .seg button[aria-pressed="true"], .trapline, .survey .own, .nav nav .drop a:hover, .nav nav .drop a:focus-visible, .nav nav .drop a[aria-current="step"], .nextstep) .ko2 { color:inherit; opacity:.78; }
.seg button { text-align:left; line-height:1.2; } .seg button .ko2 { margin-top:1px; font-size:11px; }
.progress .num > span { display:inline-block; vertical-align:baseline; }
:is(h1, .fig b, .gate b) .ko2 { font-size:max(14px, .3em); }
.nav nav a { flex-direction:column; justify-content:center; align-items:flex-start; line-height:1.15; }
.nav nav a .ko2 { margin-top:1px; font-size:11px; }
.gate p .ko2, .rank em .ko2, .year > b .ko2 { margin-top:1px; }
.plain li > b { display:block; margin-bottom:4px; }
.plain li > span { display:block; }
.gate p .sub { display:block; margin-top:6px; }
.plain .links, .aboutnote + .links { margin-top:8px; }
.links a .ko2 { font-weight:400; }
.diff small + small { margin-top:-4px; }

/* motion: the resting state above is the finished page; these rules only describe "not arrived yet" */
.moves .barhead[data-reveal] { transition:clip-path .5s cubic-bezier(.2,.7,.2,1); clip-path:inset(0); }
.moves .barhead[data-reveal]:not(.in) { clip-path:inset(0 100% 0 0); }
.moves .sq i { transition:opacity .01s linear; transition-delay:calc(var(--i) * 3ms); }
.moves [data-reveal]:not(.in) .sq i { opacity:0; transition-delay:0s; }
.moves .line i { transform-origin:left; transition:transform .8s cubic-bezier(.2,.7,.2,1); }
.moves [data-reveal]:not(.in) .line i { transform:scaleX(0); }
.moves .brd > div, .moves .rank, .moves .figs.four .fig { transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s linear; transition-delay:calc(var(--i) * 80ms); }
.moves [data-reveal]:not(.in) .brd > div { transform:rotateX(90deg); }
.moves [data-reveal]:not(.in) .rank { opacity:0; transform:translateX(-12px); }
.moves .figs.four[data-reveal]:not(.in) .fig { opacity:0; }
.moves .figs.four .fig { transition-delay:calc(var(--i) * 220ms); }

@media (prefers-reduced-motion: reduce) { .swap span, .bar i { transition:none; } }
@media (max-width:860px) { .figs.four { grid-template-columns:repeat(2, minmax(0, 1fr)); } .gates { grid-template-columns:repeat(2, minmax(0, 1fr)); } .gate { min-height:232px; } .gate h3 { margin-top:28px; } footer { margin:0 22px; } }
@media (max-width:640px) {
  .band { padding-top:44px; padding-bottom:44px; } .hero { padding-top:40px; }
  .gate { padding:16px 12px; } .gate h3 { font-size:19px; overflow-wrap:anywhere; }
  .flap { grid-template-columns:minmax(0, 1fr) auto; gap:4px 12px; } .flap time { grid-column:1 / -1; } .swap span { font-size:18px; }
  .tiles { grid-template-columns:minmax(0, 1fr); } .body { padding-left:16px; } .tag.when { display:none; }
  .figs, .figs.four, .grids, .boards { grid-template-columns:minmax(0, 1fr); } .year { grid-template-columns:minmax(0, 1fr); gap:10px; } .line { grid-template-columns:56px minmax(0, 1fr); } .line span:last-child { grid-column:1 / -1; text-align:left; }
  .rank { grid-template-columns:64px minmax(0, 1fr); } .rank em { grid-column:2; } .diff div { grid-template-columns:minmax(0, 1fr); }
  .seg button { padding:8px 13px; } #programs { display:grid; grid-template-columns:1fr 1fr; } #programs button { text-align:left; } .nav nav { gap:16px; } .progress .num b { font-size:48px; }
}
</style>

<body>
<header class="nav"><div><a class="brand" href="#home" aria-label="SNU Bridge home">SNU Bridge</a><nav aria-label="Sections"><a href="#requirements" id="tab-requirements"></a><a href="#notices" id="tab-notices"></a><span class="menu" id="menu-about"><a href="#about" id="tab-about" aria-haspopup="true"></a><span class="drop" id="drop-about"></span></span></nav></div></header>
<div class="deptbar" id="deptbar" hidden></div>
<main>
  <div id="view-home" hidden></div>
  <div id="view-requirements">
    <section class="hero">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1-requirements"></h1>
      <p class="lede" id="lede-requirements"></p>
      <div class="seg" id="programs" role="group" aria-label="Program"></div>
      <div class="pick" id="years-row" hidden><span id="years-label"></span><div class="seg" id="years" role="group" aria-label="Year of admission"></div>
        <p class="note" id="years-note"></p></div>
    </section>
    <div id="schedule">
      <section class="tiles" id="months" aria-label="Schedule"></section>
      <p class="note" id="months-note"></p>
    </div>
    <section class="progress" aria-label="Progress">
      <div class="num"><b id="done">0</b> <span id="done-of"></span></div>
      <div class="bar"><i id="bar"></i></div>
      <p class="note" id="progress-note"></p>
    </section>
    <div id="groups"></div>
  </div>
  <div id="view-notices" hidden>
    <section class="hero">
      <p class="eyebrow" id="eyebrow-notices"></p>
      <h1 id="h1-notices"></h1>
      <p class="lede" id="lede-notices"></p>
      <div class="seg" id="boards" role="group" aria-label="Department" hidden></div>
      <div class="seg" id="audiences" role="group" aria-label="Audience"></div>
    </section>
    <p class="trapline" id="pilot-note" hidden></p>
    <p class="note" id="notice-note"></p>
    <p class="note" id="calendar-note" hidden></p>
    <div id="notice-list"></div>
  </div>
  <div id="view-about" hidden></div>
</main>
<footer id="footer"></footer>
<script>
const DATA = __DATA__;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
// More than one department can have requirements. The page shows one at a time: the first ("main") unless the reader
// chose another, which is remembered. Changing department reloads the page, so every view is built for that department.
// The Background page is about the main department's boards and always opens on it.
const deptIds = Object.keys(DATA.departments), mainId = deptIds[0];
const deptId = deptIds.includes(store.get("bridge:dept")) ? store.get("bridge:dept") : mainId;
const dept = DATA.departments[deptId];
const switchTo = (id, hash) => { store.set("bridge:dept", id === mainId ? null : id); if (hash !== undefined) history.replaceState(null, "", hash || location.pathname); location.reload(); };
let program = dept.programs.includes(store.get("bridge:program")) ? store.get("bridge:program") : dept.default_program;
// Entry years exist only where the rules differ by year of admission (undergraduate). The latest year is the default.
const yearsOf = (p) => [...new Set(dept.cards.filter((c) => c.programs.includes(p)).flatMap((c) => c.entry_years || []))].sort();
let entryYear = Number(store.get("bridge:year")) || 0;
const yearOf = (p) => { const ys = yearsOf(p); return !ys.length ? 0 : ys.includes(entryYear) ? entryYear : ys[ys.length - 1]; };
const yearNow = () => yearOf(program);
const audienceOf = (p) => (p === "undergraduate" ? "Undergraduate" : "Graduate");

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(3)) if (c !== null && c !== "") node.append(c);
  return node;
}
// Two languages on one page. B(an English sentence) gives that sentence with its Korean beneath it in small type.
// Both come from one pair in bridge/text.json, and the site will not build if a sentence used here has no Korean there.
const TEXT = DATA.text;
const fill = (text, values) => text.split(/(\{\w+\})/).map((part) => { const m = part.match(/^\{(\w+)\}$/); return m ? (values[m[1]] === undefined ? "" : values[m[1]]) : part; });
const below = (...korean) => el("small", { class: "ko2", lang: "ko" }, ...korean);
const B = (english, values, koreanValues) => [...fill(english, values || {}), below(fill(TEXT[english], Object.assign({}, values, koreanValues)))];
const L = (english, values, koreanValues) => `${fill(english, values || {}).join("")} · ${fill(TEXT[english], Object.assign({}, values, koreanValues)).join("")}`;
const P = (pair) => [pair.en, below(pair.ko)];  // a pair kept in a data file instead
const koDate = (iso) => `${Number(iso.slice(0, 4))}년 ${Number(iso.slice(5, 7))}월 ${Number(iso.slice(8))}일`;
const GROUP = { start_early: () => B("Early preparation"), before_exam: () => B("Qualification examination eligibility"), general_education: () => B("General education"),
  major_courses: () => B("Major courses"), finish_coursework: () => B("Coursework completion"), credit_rules: () => B("Credit and grade rules"),
  for_degree: () => B("Degree conferral"), every_semester: () => B("Each semester") };
const AUDIENCE = { Graduate: () => B("Graduate"), Undergraduate: () => B("Undergraduate"), All: () => B("All") };
const PROGRAM = { undergraduate: () => B("Undergraduate"), masters: () => B("Master's"), phd: () => B("PhD"), integrated: () => B("Integrated MS-PhD") };
const doneKey = (id) => `bridge:${deptId}:${program}:${id}`;

// Cards written for one program come before cards shared by several, so the main rule leads its group.
const cardsOf = (p) => dept.cards.filter((c) => c.programs.includes(p) && (!(c.entry_years || []).length || c.entry_years.includes(yearOf(p))))
  .sort((a, b) => a.programs.length - b.programs.length);
const cardsNow = () => cardsOf(program);

function openCard(id) {
  const node = document.getElementById("card-" + id);
  if (node) { node.open = true; node.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function renderMonths() {
  document.getElementById("schedule").hidden = !cardsNow().some((c) => c.events.length);
  const now = new Date().getMonth() + 1;
  document.getElementById("months").replaceChildren(...[[now, B("Current month")], [now % 12 + 1, B("Following month")]].map(([m, label]) => {
    const items = cardsNow().flatMap((c) => c.events.filter((e) => e.months.includes(m)).map((e) => [e.label, c.id]));
    return el("div", { class: "tile" }, el("small", null, label), el("h3", null, MONTHS[m - 1], below(`${m}월`)),
      ...(items.length ? items.map(([text, id]) => el("a", { href: "#card-" + id, onclick: (ev) => { ev.preventDefault(); openCard(id); } }, text))
        : [el("span", null, B("No scheduled items in the handbook"))]));
  }));
}

function renderCount() {
  const tickable = cardsNow().filter((c) => c.group !== "every_semester");
  const done = tickable.filter((c) => store.get(doneKey(c.id))).length;
  document.getElementById("done").textContent = done;
  document.getElementById("done-of").replaceChildren(...B("of {total} completed", { total: tickable.length }));
  document.getElementById("bar").style.width = tickable.length ? `${(100 * done) / tickable.length}%` : "0";
}

function relatedNotices(c) {
  const list = dept.notices.filter((n) => n.cards.includes(c.id) && [audienceOf(program), "All students"].includes(n.audience)).slice(0, 3);
  if (!list.length) return null;
  return el("div", { class: "related" }, el("b", null, L("Recent notices") + ". "),
    ...list.map((n) => el("a", { href: n.url, target: "_blank", rel: "noopener" }, `${n.date}  ${n.title_en || n.title_ko}`)));
}

// Steps of one case arrive as "Online attendance: do this", repeated on every step of that case (see bridge/briefs.py).
// Show the case name once as a heading with its own numbered list. Steps outside a case keep one running count.
function stepBlocks(steps) {
  const runs = [];
  for (const text of steps) {
    const m = text.match(/^([^:.]{3,48}):\s+([\s\S]+)$/), last = runs[runs.length - 1];
    if (m && last && last.label === m[1]) last.items.push(m[2]);
    else runs.push({ label: m ? m[1] : null, items: [m ? m[2] : text], whole: text });
  }
  const blocks = [];
  let plain = null, counted = 0;
  for (const run of runs) {
    if (run.label && run.items.length > 1) {
      plain = null;
      blocks.push(el("h4", null, run.label), el("ol", null, ...run.items.map((t) => el("li", null, t))));
    } else {
      if (!plain) blocks.push(plain = el("ol", { start: String(counted + 1) }));
      plain.append(el("li", null, run.whole));
      counted += 1;
    }
  }
  return blocks;
}

// A question for the assistant, ready to paste. It carries the ORIGINAL notice's address, not this site's translation,
// so the assistant reads the department's own page, images and files, and nothing passes through this site on the way.
const QUESTION = (url) => "Explain this Seoul National University notice for an international student, in English. " +
  "Open the original page and read everything on it, including images and attached files:\n" + url + "\n" +
  "Tell me: who must act, every date with the Korean text beside it, the steps, and anything you could not open. " +
  "If it depends on my program or year of entry, ask me.";
const askButton = (n) => { const done = el("span", { class: "asked", hidden: "" }, ...B("Copied. Paste it into {assistant}.", { assistant: assistantLink() }, { assistant: dept.assistant.name }));
  const button = el("button", { type: "button", class: "ask", onclick: async () => {
    try { await navigator.clipboard.writeText(QUESTION(n.url)); } catch (e) { window.prompt(L("Copy this question"), QUESTION(n.url)); }
    done.hidden = false; } }, ...B("Copy a question about the original notice for {assistant}", { assistant: dept.assistant.name }));
  return el("p", { class: "askline" }, button, done); };
const assistantLink = () => el("a", { href: dept.assistant.url, target: "_blank", rel: "noopener" }, dept.assistant.name);
let audience = audienceOf(program);
// A pilot is a department with notices only. The Notices page can show it; every other page stays this department's.
const pilots = DATA.pilots || {};
let board = deptId;
let aboutStep = "";  // which step of the About page is on screen; "" is the first
// The steps of the About page, as the menu under the About tab lists them and as each step is titled.
const STEP_LABEL = { why: () => B("Why now"), engineering: () => B("Engineering departments"), department: () => [dept.short || dept.name, below(dept.name_ko)],
  examples: () => B("In practice"), method: () => B("How it works"), checks: () => B("Checks and limits") };
const aboutKeys = () => (dept.evidence && dept.evidence_notes ? [DATA.context && "why", DATA.survey && "engineering", "department", "examples", "method", "checks"].filter(Boolean) : []);
function renderAboutMenu() {
  const keys = aboutKeys(), now = Math.max(0, keys.indexOf(aboutStep)), on = !document.getElementById("view-about").hidden;
  document.getElementById("drop-about").replaceChildren(...keys.map((k, i) =>
    el("a", { href: "#about-" + k, "aria-current": on && i === now ? "step" : "false" }, el("b", null, String(i + 1)), el("span", null, ...STEP_LABEL[k]()))));
}
function renderNotices() {
  const pilot = board !== deptId, nd = pilot ? pilots[board] : dept, anchor = (id) => "notice-" + (pilot ? board + "-" : "") + id;
  const boards = document.getElementById("boards"), pilotNote = document.getElementById("pilot-note");
  boards.hidden = !Object.keys(pilots).length;
  boards.replaceChildren(...[deptId, ...Object.keys(pilots)].map((k) =>
    el("button", { type: "button", "aria-pressed": String(k === board), onclick: () => { board = k; audience = "All"; history.replaceState(null, "", k === deptId ? "#notices" : "#notices-" + k); renderNotices(); } },
      k === deptId ? `${dept.name} · ${dept.name_ko}` : L("{name} (pilot)", { name: pilots[k].name }, { name: pilots[k].name_ko }))));
  const nr = !pilot && dept.notice_reading, unread = !nr;  // the second reader's pass over this department's notices, if any
  pilotNote.hidden = false;
  pilotNote.className = nr ? "note" : "trapline";
  pilotNote.replaceChildren(...(pilot ? B("Pilot. Notices only: this department's requirements have not been written, and these translations have not been re-read by the second reader.")
    : unread ? B("These translations have not been re-read by the second reader.")
    : B("Notices up to {date} were re-read by a second AI reader from another maker: {a} of {n} stood as written and {c} were corrected. Newer notices have not been re-read.",
        { date: fullDate(nr.date), a: num(nr.agreed + nr.noted), n: num(nr.read), c: num(nr.corrected) }, { date: koDate(nr.date) })));
  document.getElementById("eyebrow-notices").replaceChildren(...B("Department of {name}", { name: nd.name }, { name: nd.name_ko }));
  document.getElementById("lede-notices").replaceChildren(...(pilot || deptId !== mainId ? B("Notices from the department's notice board, with English titles. Each entry links to the original notice.")
    : B("Notices from the department's academic board, with English titles. Each entry links to the original notice.")));
  const options = { Graduate: ["Graduate", "All students"], Undergraduate: ["Undergraduate", "All students"], All: null };
  document.getElementById("audiences").replaceChildren(...Object.keys(options).map((a) =>
    el("button", { type: "button", "aria-pressed": String(a === audience), onclick: () => { audience = a; renderNotices(); } }, AUDIENCE[a]())));
  const shown = nd.notices.filter((n) => !options[audience] || options[audience].includes(n.audience));
  document.getElementById("notice-note").replaceChildren(...B("{n} notices since {date}. English titles are unofficial translations; the original notices are in Korean.",
    { n: shown.length, date: fullDate(nd.board.since) }, { date: koDate(nd.board.since) }));
  // Deadlines as a calendar the student subscribes to once. Shown for the department whose notices are checked.
  const cal = !pilot && dept.calendar, calNote = document.getElementById("calendar-note");
  calNote.hidden = !cal;
  if (cal) {
    const file = location.origin + location.pathname.replace(/[^/]*$/, "") + cal.file, feed = file.replace(/^https?:/, "webcal:");
    calNote.replaceChildren(...B("Deadlines as a calendar: {n} dated events from these notices. Subscribe once and it follows the notices.", { n: cal.events }),
      el("span", { class: "links" }, el("a", { href: feed }, L("Apple Calendar or Outlook")),
        el("a", { href: "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(feed), target: "_blank", rel: "noopener" }, L("Google Calendar")),
        el("a", { href: cal.file }, L("Calendar file"))),
      ...B("Only dates the notice prints with a weekday are included, and each was checked against that weekday. To be reminded, set a notification for this calendar in your calendar app."));
  }
  const byMonth = new Map();
  for (const n of shown) { const k = n.date.slice(0, 7); byMonth.set(k, [...(byMonth.get(k) || []), n]); }
  document.getElementById("notice-list").replaceChildren(...[...byMonth].map(([k, list]) =>
    el("section", { class: "group month" },
      el("h2", null, el("span", { class: "plainspan" }, `${MONTHS[Number(k.slice(5)) - 1]} ${k.slice(0, 4)}`, below(`${k.slice(0, 4)}년 ${Number(k.slice(5))}월`)), el("span", null, B("{n} notices", { n: list.length }))),
      el("div", { class: "list" }, ...list.map((n) => {
        const card = cardsNow().find((c) => n.cards.includes(c.id));
        const b = n.brief;
        const links = el("div", { class: "links" },
          el("a", { href: n.url, target: "_blank", rel: "noopener" }, L("Original notice")),
          card ? el("a", { href: "#card-" + card.id, onclick: (ev) => { ev.preventDefault(); history.replaceState(null, "", "#card-" + card.id); show("requirements", true); openCard(card.id); } }, L("Related requirement") + ": " + card.title) : null);
        return el("details", { class: "notice", id: anchor(n.id) },
          el("summary", null, el("div", { class: "head" },
            el("div", { class: "meta" }, n.date,
              n.category ? el("span", { class: "tag" }, `${n.category.en} · ${n.category.ko}`) : null,
              n.edited || (b && b.revised) ? el("span", { class: "tag trap" }, L("Revised")) : null,
              b && b.dates.length ? el("span", { class: "tag" }, L("Dates: {n}", { n: b.dates.length })) : null),
            el("div", { class: "en" }, n.title_en || L("Translation pending")))),
          el("div", { class: "body" },
            el("p", { class: "ko", lang: "ko" }, n.title_ko),
            ...(b ? (() => {
              // The short parts (summary, dates, who must act, conditions, steps) were written to leave nothing out, and
              // for most notices they add up to more words than the notice itself. A summary longer than its original
              // is not a summary: then the full translation is shown open and the checklist is one tap away. Only when
              // the short parts really are shorter is the checklist shown open instead.
              const words = (s) => s.split(/\s+/).filter(Boolean).length;
              const listed = [b.applies_to, ...(b.conditions || []), ...b.steps].filter(Boolean);
              const short = [b.summary, ...listed, ...b.dates.flatMap((d) => [d.what, d.when])].reduce((a, s) => a + words(s), 0);
              const listFirst = listed.length > 0 && short < words(b.translation);
              const checklist = listed.length ? el("details", Object.assign({ class: "full" }, listFirst ? { open: "" } : {}), el("summary", null, L("Checklist: who must act, conditions and steps")),
                b.applies_to ? el("p", null, el("b", null, L("Who must act") + ". "), b.applies_to) : null,
                (b.conditions || []).length ? el("div", { class: "conds" }, el("b", null, B("Conditions and exceptions")), el("ul", null, ...b.conditions.map((x) => el("li", null, x)))) : null,
                ...stepBlocks(b.steps)) : null;
              const full = el("details", Object.assign({ class: "full" }, listFirst ? {} : { open: "" }), el("summary", null, L("Full English translation")),
                ...b.translation.split(/\n\s*\n/).map((t) => el("p", null, t)));
              return [
              el("p", null, b.summary),
              b.dates.length ? el("table", null, ...b.dates.map((d) => el("tr", null,
                el("td", null, d.what), el("td", null, d.when,
                  el("small", { lang: "ko" }, d.original_ko + (d.verified ? "" : "  (" + L("not found in the notice text") + ")")))))) : null,
              b.images ? el("p", { class: "trapline" }, el("b", null, L("Caution") + ". "),
                dept.assistant ? B("Images in this notice that could not be read: {n}. For English, paste a screenshot into {assistant}.", { n: b.images, assistant: assistantLink() }, { assistant: dept.assistant.name })
                  : B("Images in this notice that could not be read: {n}. Please check the original notice.", { n: b.images })) : null,
              b.attachments.length ? el("p", null, el("b", null, L("Attachments (Korean)") + ". "), b.attachments.join("; ") + ". ",
                dept.assistant ? B("For English, upload to {assistant}.", { assistant: assistantLink() }, { assistant: dept.assistant.name }) : "") : null,
              dept.assistant ? askButton(n) : null,
              ...(listFirst ? [checklist, full] : [full, checklist]),
              ];
            })() : [el("p", null, B("A translation of this notice is being prepared."))]),
            links,
            el("div", { class: "source" }, b ? B("Translated by AI on {date}. AI can make mistakes. Please check important details against the original notice.", { date: fullDate(b.written) }, { date: koDate(b.written) })
              : B("Title translated manually. Unofficial."))));
      })))));
}

function openNotice(id) {
  const node = document.getElementById("notice-" + id);
  if (node) { node.open = true; node.scrollIntoView({ block: "center" }); }
}

// Home: what the site is, one column per program, and the latest notices as a board that turns from Korean to English.
const longDay = (iso) => `${iso.slice(8)} ${MONTHS[Number(iso.slice(5, 7)) - 1].slice(0, 3)}`;
function programFacts(p) {
  const cards = cardsOf(p), years = yearsOf(p);
  const fact = cards.find((c) => c.id === dept.headline_cards[p]);
  const parts = fact ? fact.key.match(/^(\d+)\s+([^;]+)(?:;\s*(.+))?$/) : null;  // "24 credits; 3.0 average"
  return { label: PROGRAM[p] ? PROGRAM[p]() : DATA.program_labels[p], count: cards.length, number: parts ? parts[1] : "", unit: parts ? parts[2] : "",
    rest: [parts ? parts[3] : fact ? fact.key : "", years.length ? el("span", { class: "sub" }, B("Admitted {from} to {to}", { from: years[0], to: years[years.length - 1] })) : ""],
    go: () => { program = p; store.set("bridge:program", p); audience = audienceOf(p); render(); } };
}
let boardPlayed = false;

// Motion. A part of the page moves into place once, when it scrolls into view: section bars slide in, squares and
// bars fill, board rows turn, numbers count up. Nothing is hidden unless this code is running, and people who ask

const STILL = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let waiting = [];
function countUp(node) {

  const tick = (now) => { const t = Math.min(1, (now - began) / span); node.firstChild.nodeValue = num(Math.round(to * (1 - Math.pow(1 - t, 3)))); if (t < 1) requestAnimationFrame(tick); };
  if (to > 0) requestAnimationFrame(tick);
}
function settle() {  // whatever has scrolled into the lower part of the window arrives
  waiting = waiting.filter((node) => {
    const box = node.getBoundingClientRect();
    if (box.top >= window.innerHeight * 0.88) return node.isConnected;  // still below; anything above the window counts as seen
    node.classList.add("in");
    for (const n of node.matches("[data-count]") ? [node] : node.querySelectorAll("[data-count]")) countUp(n);
    return false;
  });
}
let due = false;
const soon = () => { if (!due) { due = true; setTimeout(() => { due = false; settle(); }, 40); } };  // at most 25 checks a second

window.addEventListener("resize", soon);
function animate(root) {
  if (STILL) return;
  document.documentElement.classList.add("moves");
  waiting = [...root.querySelectorAll("[data-reveal], .gate [data-count]")];
  setTimeout(settle, 60);  // a timer, not a frame callback: it still fires if the tab is in the background
}

function show(view, keepScroll) {

  }
  if (view === "home") renderHome();
  if (view === "about") renderAbout();
  if (view === "home" || view === "about") animate(document.getElementById("view-" + view));
  if (view === "notices") renderNotices();
  renderAboutMenu();
  if (!keepScroll) window.scrollTo(0, 0);
}
