# Every morning: read each department's board, translate what is new, rebuild the site and publish it.
# Needs one repository secret holding the model key, named ANTHROPIC_API_KEY or API_KEY
# (Settings > Secrets and variables > Actions).
name: Update and publish

on:
  schedule:
    - cron: "17 22 * * *"   # 07:17 in Seoul, every day
  workflow_dispatch:         # the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write            # to save new notices and translations back to the repository
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # A push only republishes. The board is read on the daily schedule and on "Run workflow".
      - name: Read the boards and translate new notices
        if: github.event_name != 'push'
        env:
          # the secret may be named ANTHROPIC_API_KEY or API_KEY
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.API_KEY }}
        id: read
        run: |
          # One department's site being down must not stop the others, lose what was already translated,
          # or keep the page from being rebuilt. The run is marked failed at the very end instead.
          trouble=0
          for folder in sources/*/; do
            department=$(basename "$folder")
            python -m bridge notices "$department" || { echo "::warning::$department: its notice board could not be read today"; trouble=1; continue; }
            python -m bridge briefs "$department" 40 || { echo "::warning::$department: its notices could not be read today"; trouble=1; }
          done
          echo "trouble=$trouble" >> "$GITHUB_OUTPUT"

      - name: Save what changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # Someone may have pushed while this run was reading the boards: take their work in first, then push.
          git diff --cached --quiet || (git commit -m "Daily update: notices and translations" && git pull --rebase && git push)

      - run: python -m bridge site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # After the page is published: tell the owner (GitHub emails a failed run) if any department could not be read.
      - name: Report a department that could not be read
        if: steps.read.outputs.trouble == '1'
        run: exit 1

