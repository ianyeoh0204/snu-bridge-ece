# Every morning: read each department's board, translate what is new, rebuild the site and publish it.
# Needs one repository secret, ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
name: Update and publish

on:
  schedule:
    - cron: "17 22 * * *"   # 07:17 in Seoul, every day
  workflow_dispatch:         # the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write            # to save new notices and translations back to the repository
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # A push only republishes. The board is read on the daily schedule and on "Run workflow".
      - name: Read the boards and translate new notices
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for folder in sources/*/; do
            department=$(basename "$folder")
            python -m bridge notices "$department"
            python -m bridge briefs "$department"
          done

      - name: Save what changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daily update: notices and translations" && git push)

      - run: python -m bridge site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
